diffusion:
  implementation: "ddpm"
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: "linear"
  ddim:
    eta: 0.0
    steps: 50
  dpm_solver:
    order: 2
    steps: 20

model:
  type: "unet"
  in_channels: 1
  out_channels: 1
  unet: {}
  dit: {}
  condition:
    type: "class"
    num_classes: 10
    embedding_dim: 128

global:
  device: "cuda"
  training:
    batch_size: 16
    learning_rate: 0.0001
    num_epochs: 100
    gradient_clip: 1.0
